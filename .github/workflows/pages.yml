name: Deploy web app to GitHub Pages

# The web app lives in webapp/ rather than docs/, since docs/ already holds
# DESIGN.md and the other project documentation -- classic GitHub Pages only
# serves the repo root or /docs, so an Actions-based deploy is what lets the
# two live side by side without moving either.
on:
  push:
    branches: [master]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
